# Roda a cada push e pull request: sintaxe dos scripts, SEO e os testes do chat.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe dos scripts JavaScript
        run: |
          # Scripts clássicos (dados de tradução, carregador, boot e Web Components e service worker)
          for f in i18n.js i18n/*.js components/*.js sw.js; do
            node --check "$f"
          done
          # Módulos ES (site, demos, Worker e geradores)
          for f in script.js api.js chat.js analytics-consent.js chat/*.js demos/*.js demos/*/*.js vaga/*.js como-construi/*.js worker/src/*.js worker/src/rotas/*.js; do
            node --input-type=module --check < "$f" || { echo "Erro de sintaxe em $f"; exit 1; }
          done
          for f in worker/gerar-conhecimento.mjs worker/indexar-vectorize.mjs scripts/*.mjs; do
            node --check "$f"
          done

      - name: SEO (sitemap.xml e dados estruturados)
        run: |
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml'); print('sitemap.xml válido')"
          python3 - <<'PY'
          import json, re
          html = open("index.html", encoding="utf-8").read()
          data = json.loads(re.search(r'<script type="application/ld\+json">(.*?)</script>', html, re.S).group(1))
          assert data["@type"] == "Person", data["@type"]
          print("JSON-LD válido:", data["name"])
          PY

      - name: Projetos e habilidades do index.html em dia com data/
        run: node scripts/gerar-secoes.mjs --check

      - name: Módulos ES do index.html todos no importmap
        run: node scripts/conferir-modulos.mjs

      - name: Conhecimento da IA é gerado sem erros
        run: node worker/gerar-conhecimento.mjs

      - name: Comparação de vagas
        run: node --test worker/tests/*.test.js

      - name: Demo de segurança RAG
        run: node --test demos/guardrail/core.test.js

      - name: Testes do assistente (chat)
        run: ./tests/rodar-testes-chat.sh

  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Lighthouse (desempenho, acessibilidade, boas práticas e SEO)
        run: npx --yes @lhci/cli@0.15.1 autorun
