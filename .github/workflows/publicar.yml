# Publica o site no GitHub Pages a cada push na main, com os PDFs do currículo gerados na hora a partir
# dos dados (data/ e i18n/) — os PDFs não ficam no repositório.
# Requer: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; um push novo cancela a que ainda está na fila.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Páginas geradas em dia com data/, idiomas.js e i18n/pt.js
        run: node scripts/gerar-secoes.mjs --check

      - name: Fontes para o currículo em chinês
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Monta o site (arquivos do repositório, sem os de desenvolvimento)
        run: |
          mkdir _site
          git ls-files -z \
            | grep -zv -E '^(\.github/|\.gitignore$|worker/|tests/|scripts/|apps-script/|docs/|lighthouserc\.json$|gerar-curriculos\.sh$)' \
            | xargs -0 cp --parents -t _site

      - name: Gera os PDFs do currículo
        run: ./gerar-curriculos.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
