<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Segurança: só carrega recursos destes domínios (CSP) e não envia o endereço completo a outros sites. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at https://challenges.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://emanueleborges.goatcounter.com; connect-src 'self' https://emanuel-portfolio-chat.emanuel-portfolio-chat.workers.dev https://api.github.com https://emanueleborges.goatcounter.com https://cdn.jsdelivr.net; frame-src https://challenges.cloudflare.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title data-t="meta.title">Face Recognition in the Browser — Emanuel Borges</title>
    <meta name="description" data-t-content="meta.description" content="Real-time face recognition with face-api.js: detection, 128-dimension embeddings and matching, entirely in your browser — the camera never leaves your device." />
    <meta name="theme-color" content="#06100b" />
    <!-- Tema antes da pintura (evita piscar): ?theme= ou o salvo; padrão "amazonia". -->
    <script>(function(){var t;try{t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("theme")}catch(e){}t=t==="editorial"?"editorial":"amazonia";document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="editorial"?"#f6f3ec":"#06100b"})();</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../demos.css" />
    <style>
      .stage { position: relative; display: grid; place-items: center; min-height: 260px; margin-top: 18px; overflow: hidden; border: 1px dashed var(--line); border-radius: 12px; background: var(--stage); }
      .stage video, .stage img { display: block; max-width: 100%; max-height: 520px; }
      .stage video { transform: scaleX(-1); }
      .stage canvas { position: absolute; pointer-events: none; }
      .stage .empty { padding: 24px; text-align: center; color: var(--muted); font-size: 14px; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 10px; }
      .enroll { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
      .enroll input { flex: 1 1 200px; min-height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--text); font: 500 14px Manrope, sans-serif; }
      .button:disabled { opacity: .45; cursor: not-allowed; }
      label.button { cursor: pointer; }
      label.button:focus-within { outline: 2px solid var(--accent-text); outline-offset: 2px; }
      .people { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; padding: 0; list-style: none; }
      .people li { display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
      .people button { width: 22px; height: 22px; border: 0; border-radius: 50%; background: var(--line); color: var(--text); cursor: pointer; }
      .privacy { margin-top: 22px; padding: 12px 16px; border: 1px solid rgba(var(--accent-2-rgb), .3); border-radius: 12px; background: rgba(var(--accent-2-rgb), .06); font-size: 13px; color: var(--accent-text); }
      .results { margin: 12px 0 0; font-size: 14px; }
      [data-status] { min-height: 3.2em; }
    </style>
    <script src="../demos.js" defer></script>
    <script src="face.js" defer></script>
    <!-- GoatCounter: conta só o caminho (sem ?lang=, ?theme=…), para não dividir a mesma página; a origem (?ref=, utm_*) continua registrada. -->
    <script>window.goatcounter = { path: function (p) { return p.split("?")[0].replace(/index\.html$/, "") || "/"; } };</script>
    <script data-goatcounter="https://emanueleborges.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>
    <div class="shell">
      <header>
        <a class="brand" href="/"><svg class="logo brand-logo" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true" focusable="false"><defs><linearGradient id="lgd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-bg1)"/><stop offset="1" style="stop-color:var(--logo-bg2)"/></linearGradient><linearGradient id="lgd-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-edge1)"/><stop offset="1" style="stop-color:var(--logo-edge2)"/></linearGradient><linearGradient id="lgd-letter" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-letter1)"/><stop offset="0.55" style="stop-color:var(--logo-letter2)"/><stop offset="1" style="stop-color:var(--logo-letter3)"/></linearGradient><radialGradient id="lgd-node" cx=".35" cy=".35" r=".75"><stop offset="0" style="stop-color:var(--logo-node1)"/><stop offset="0.55" style="stop-color:var(--logo-node2)"/><stop offset="1" style="stop-color:var(--logo-node3)"/></radialGradient><radialGradient id="lgd-shine" cx=".2" cy=".1" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lgd-bg)" stroke="url(#lgd-edge)" stroke-width="2.5"/><rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="url(#lgd-shine)"/><path class="logo-e" d="M17 46.5V17.5h19M17 32h14M17 46.5h19" fill="none" stroke="url(#lgd-letter)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/><circle class="logo-ring" cx="49" cy="46.5" r="7" fill="none" stroke-width="1.6"/><circle class="logo-node" cx="49" cy="46.5" r="4.4" fill="url(#lgd-node)"/></svg> Emanuel Borges</a>
        <div class="header-tools">
          <button class="theme-toggle" type="button" data-theme-toggle><span class="theme-swatch" aria-hidden="true"></span><span class="theme-name" data-theme-name>Amazônia</span></button>
          <label><span class="visually-hidden" data-t="lang">Language</span>
          <select data-lang>
            <option value="en" lang="en">English</option>
            <option value="pt" lang="pt-BR">Português</option>
            <option value="es" lang="es">Español</option>
            <option value="fr" lang="fr">Français</option>
            <option value="it" lang="it">Italiano</option>
            <option value="de" lang="de">Deutsch</option>
            <option value="zh" lang="zh-CN">中文</option>
            <option value="ru" lang="ru">Русский</option>
          </select>
        </label>
        </div>
      </header>

      <main>
        <p class="kicker" data-t="kicker"></p>
        <h1 data-t="title"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="links">
          <a class="button" href="/#projetos" data-t="back"></a>
          <a class="button" href="https://github.com/emanueleborges/face-recognition-poc" target="_blank" rel="noopener" data-t="code"></a>
        </div>
        <p class="privacy" data-t="privacy"></p>

        <section class="panel">
          <div class="toolbar">
            <button class="button primary" type="button" data-camera data-t="camOn"></button>
            <label class="button" style="display:inline-flex">
              <span data-t="upload"></span>
              <input type="file" accept="image/*" class="visually-hidden" data-upload />
            </label>
            <button class="button" type="button" data-sample data-t="sample"></button>
          </div>
          <p class="status" data-status aria-live="polite"></p>
          <div class="stage" data-stage><p class="empty" data-t="empty"></p></div>
          <p class="results" data-results aria-live="polite"></p>

          <form class="enroll" data-enroll>
            <input type="text" maxlength="40" data-name data-t-placeholder="namePh" data-t-aria="namePh" autocomplete="off" />
            <button class="button primary" type="submit" data-enroll-button disabled data-t="enroll"></button>
          </form>
          <h2 class="h3" style="margin-top:20px" data-t="people"></h2>
          <ul class="people" data-people></ul>
        </section>

        <p class="note" data-t="hint"></p>
        <p class="note" data-t="how"></p>
      </main>
    </div>
  </body>
</html>
