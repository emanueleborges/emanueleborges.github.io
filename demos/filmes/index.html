<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Segurança: só carrega recursos destes domínios (CSP) e não envia o endereço completo a outros sites. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.githubusercontent.com https://github.com; connect-src 'self' https://emanuel-portfolio-chat.emanuel-portfolio-chat.workers.dev https://api.github.com https://cdn.jsdelivr.net https://data.jsdelivr.com https://raw.githubusercontent.com; frame-src https://challenges.cloudflare.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title data-t="meta.title">Movie Recommender with TF-IDF — Emanuel Borges</title>
    <meta name="description" data-t-content="meta.description" content="Content-based movie recommendations with TF-IDF and cosine similarity over 1,500 films, computed in your browser, with the terms that explain each match." />
    <meta name="theme-color" content="#050f14" />
    <script src="../../components/boot.js"></script>
    <link rel="icon" href="/imagens/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/imagens/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/imagens/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../demos.css" />
    <style>
      .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      .field { display: flex; gap: 8px; }
      .field input { flex: 1; min-width: 0; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--text); font: 500 14px Manrope, sans-serif; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--text); font: 600 12px Manrope, sans-serif; cursor: pointer; }
      .chip:hover { border-color: rgba(var(--accent-rgb),.5); }
      .picked { margin-top: 22px; padding: 16px 18px; border-left: 3px solid var(--cyan); border-radius: 0 12px 12px 0; background: rgba(var(--accent-2-rgb), .06); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 16px; }
      .movie { display: flex; flex-direction: column; gap: 6px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
      .movie .movie-title { margin: 0; font-size: 16px; letter-spacing: -.02em; }
      .movie .movie-title small { color: var(--muted); font-weight: 500; }
      .meta { font-size: 12px; color: var(--muted); }
      .score { display: flex; align-items: center; gap: 8px; font: 500 12px "DM Mono", monospace; color: var(--accent-text); }
      .bar { flex: 1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
      .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
      .terms { font-size: 12px; color: var(--muted); }
      .terms b { color: var(--accent-text); font-weight: 600; }
      .movie p { margin: 0; font-size: 13px; color: var(--muted); }
      .movie .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 6px; font-size: 13px; }
      .linklike { padding: 0; border: 0; background: none; color: var(--accent-text); font: 700 13px Manrope, sans-serif; cursor: pointer; }
      .movie .actions a { color: var(--muted); }
      .credits { margin: 40px 0 56px; font-size: 12px; color: var(--muted); }
      @media (max-width: 720px) { .modes { grid-template-columns: 1fr; } }
      @media (max-width: 420px) { .field { flex-wrap: wrap; } .field input { flex-basis: 100%; } .field .button { width: 100%; justify-content: center; } }
    </style>
    <link rel="preload" href="filmes.json" as="fetch" crossorigin="anonymous" />
    <script type="module" src="filmes.js"></script>
    <script type="module" src="../../analytics-consent.js"></script>
    <script src="../../components/components.js" defer></script>
  </head>
  <body>
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>
    <div class="shell">
      <header>
        <a class="brand" href="/"><site-logo class="brand-logo" size="32"></site-logo> Emanuel Borges</a>
        <div class="header-tools">
          <share-button></share-button>
          <sound-toggle></sound-toggle>
          <theme-toggle></theme-toggle>
          <label><span class="visually-hidden" data-t="lang">Language</span>
          <select data-lang>
            <option value="en" lang="en">English</option>
            <option value="pt" lang="pt-BR">Português</option>
            <option value="es" lang="es">Español</option>
            <option value="fr" lang="fr">Français</option>
            <option value="it" lang="it">Italiano</option>
            <option value="de" lang="de">Deutsch</option>
            <option value="zh" lang="zh-CN">中文</option>
            <option value="ru" lang="ru">Русский</option>
          </select>
        </label>
        </div>
      </header>

      <main>
        <p class="kicker" data-t="kicker"></p>
        <h1 data-t="title"></h1>
        <p class="lead" data-t="lead"></p>
        <div class="links">
          <a class="button" href="/#projetos" data-t="back"></a>
          <a class="button" href="https://github.com/emanueleborges/challenge-movies" target="_blank" rel="noopener" data-t="code"></a>
        </div>

        <section class="panel">
          <div class="modes">
            <form data-pick-form>
              <label><span data-t="pickLabel"></span>
                <span class="field">
                  <input list="titles" data-pick data-t-placeholder="pickPh" autocomplete="off" />
                  <button class="button primary" type="submit" data-t="recommend"></button>
                </span>
              </label>
              <datalist id="titles"></datalist>
              <div class="chips" data-examples></div>
            </form>
            <form data-search-form>
              <label><span data-t="searchLabel"></span>
                <span class="field">
                  <input data-search data-t-placeholder="searchPh" autocomplete="off" maxlength="200" />
                  <button class="button primary" type="submit" data-t="search"></button>
                </span>
              </label>
              <div class="chips" data-queries></div>
            </form>
          </div>
          <p class="status" data-status aria-live="polite"></p>
          <div data-picked></div>
          <div class="grid" data-results aria-live="polite"></div>
        </section>

        <p class="note" data-t="how"></p>
        <p class="credits" data-t="credits"></p>
      </main>
    </div>
  </body>
</html>
