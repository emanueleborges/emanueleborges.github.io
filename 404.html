<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Segurança: só carrega recursos destes domínios (CSP) e não envia o endereço completo a outros sites. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.githubusercontent.com https://github.com; connect-src 'self' https://emanuel-portfolio-chat.emanuel-portfolio-chat.workers.dev https://api.github.com https://cdn.jsdelivr.net https://data.jsdelivr.com https://raw.githubusercontent.com; frame-src https://challenges.cloudflare.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050f14" />
    <script src="/idiomas.js"></script>
    <script src="/components/boot.js"></script>
    <script>
      // Links antigos para os PDFs (/cv/…-<idioma>.pdf): o currículo agora é gerado pelo site.
      (function () {
        var old = location.pathname.match(/^\/cv\/.+-([a-z]{2})\.pdf$/);
        if (old) location.replace("/curriculo.html?lang=" + old[1] + "&pdf=1");
        // A página de análise de vagas (/vaga/) foi retirada: quem tiver o link vai para o portfólio.
        else if (/^\/vaga(\/|$)/.test(location.pathname)) location.replace("/");
      })();
    </script>
    <title data-perfil="Page not found — {nomeCompleto}">Page not found — Emanuel Borges</title>
    <link rel="icon" href="/imagens/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/imagens/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/temas.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: Manrope, sans-serif; overflow-x: clip; }
      .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: var(--glow-opacity, .45); pointer-events: none; }
      .glow-1 { width: 520px; height: 520px; left: -160px; top: -200px; background: var(--glow-1); }
      .glow-2 { width: 480px; height: 480px; right: -160px; bottom: -220px; background: var(--glow-2); }
      main { position: relative; max-width: 620px; text-align: center; }
      .brand { display: inline-block; margin-bottom: 26px; border-radius: 16px; filter: drop-shadow(0 0 18px rgba(138,89,255,.35)); }
      site-logo { display: block; line-height: 0; }
      .logo-404 { width: 56px; height: 56px; }
      site-logo .logo { width: 100%; height: 100%; }
      /* Logo "E." (SVG nas páginas): cores pelo tema; o E se desenha ao carregar, o nó de IA emite um pulso,
         e ao passar o mouse o logo gira e brilha. Sem efeitos com "reduzir movimento". */
      .logo { overflow: visible; }
      .logo-fundo { opacity: 0; animation: logo-surgir .5s ease .55s forwards; }
      .logo-borda, .logo-e { stroke-dasharray: 101; stroke-dashoffset: 101; opacity: 0; animation: logo-tracar .8s cubic-bezier(.65,0,.35,1) forwards; }
      .logo-e1 { animation-duration: .55s; animation-delay: .6s; }
      .logo-e2 { animation-duration: .25s; animation-delay: 1.1s; }
      .logo-e3 { animation-duration: .3s; animation-delay: 1.3s; }
      .logo-ring { stroke: var(--logo-ring); stroke-opacity: .45; transform-origin: 49px 46.5px; opacity: 0; animation: logo-surgir .3s ease 1.55s forwards, logo-pulse 3.2s ease-out 1.75s infinite; }
      .logo-node { transform-origin: 49px 46.5px; transform: scale(0); animation: logo-pop .5s cubic-bezier(.34,1.56,.64,1) 1.55s forwards; }
      @keyframes logo-surgir { to { opacity: 1; } }
      @keyframes logo-tracar { from { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes logo-pop { from { transform: scale(0); } to { transform: scale(1); } }
      @keyframes logo-pulse { 0% { transform: scale(1); stroke-opacity: .55; } 70%, 100% { transform: scale(1.9); stroke-opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .logo-ring, .logo-fundo, .logo-borda, .logo-e, .logo-node { animation: none !important; opacity: 1; stroke-dashoffset: 0; transform: none; } }
      .code { margin: 0; font: 500 13px "DM Mono", monospace; letter-spacing: .2em; color: var(--kicker-alt); }
      h1 { margin: 14px 0 0; font-size: clamp(38px, 8vw, 64px); line-height: 1.05; letter-spacing: -.05em; }
      h1 span { background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
      p.lead { margin: 18px auto 0; max-width: 480px; color: var(--muted); font-size: 16px; line-height: 1.6; }
      p.lead + p.lead { margin-top: 6px; font-size: 14px; }
      .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
      .button { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 13px; color: var(--text); font-weight: 700; font-size: 14px; text-decoration: none; transition: transform .2s; }
      .button:hover { transform: translateY(-2px); }
      .button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
      .primary { background: var(--grad-primary); color: var(--on-primary); box-shadow: 0 8px 30px rgba(0,0,0,.18); }
      .quiet { border: 1px solid var(--quiet-line); background: var(--quiet-bg); }
    </style>
    <script src="/perfil.js" defer></script>
    <script type="module" src="/analytics-consent.js"></script>
    <script src="/components/components.js" defer></script>
  </head>
  <body>
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>
    <main>
      <a class="brand" href="/" aria-label="Emanuel Borges — home" data-perfil-aria-label="{nomeCompleto} — home"><site-logo class="logo-404" size="56"></site-logo></a>
      <p class="code">// 404</p>
      <h1>This page <span>doesn't exist.</span></h1>
      <p class="lead">The link may be broken or the page may have moved. Head back to the portfolio or ask the assistant what you were looking for.</p>
      <p class="lead" lang="pt-BR">Esta página não existe. Volte ao portfólio ou pergunte ao assistente o que você procura.</p>
      <div class="actions">
        <a class="button primary" href="/">Go to portfolio <span aria-hidden="true">↗</span></a>
        <a class="button quiet" href="/#chat">Ask the assistant <span aria-hidden="true">💬</span></a>
      </div>
    </main>
  </body>
</html>
