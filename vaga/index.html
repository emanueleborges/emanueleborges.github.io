<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-t="meta.title">Does your role match Emanuel? — Emanuel Borges</title>
    <meta name="description" data-t-content="meta.description" content="Paste a job description and see, requirement by requirement, how Emanuel Borges's profile matches it — with evidence from his portfolio." />
    <meta name="theme-color" content="#06100b" />
    <!-- Tema antes da pintura (evita piscar): ?theme= ou o salvo; padrão "amazonia". -->
    <script>(function(){var t;try{t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("theme")}catch(e){}t=t==="editorial"?"editorial":"amazonia";document.documentElement.dataset.theme=t;var m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="editorial"?"#f6f3ec":"#06100b"})();</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../demos/demos.css" />
    <style>
      textarea { width: 100%; min-height: 220px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--text); font: 500 14px/1.6 Manrope, sans-serif; resize: vertical; }
      textarea:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
      .row .count { margin-left: auto; font: 500 12px "DM Mono", monospace; color: var(--muted); }
      .button:disabled { opacity: .5; cursor: progress; }
      .privacy { margin-top: 12px; font-size: 13px; color: var(--muted); }
      .loading[hidden] { display: none; }
      .loading { display: flex; align-items: center; gap: 12px; margin-top: 22px; color: var(--muted); }
      .spinner { width: 22px; height: 22px; border: 3px solid rgba(var(--accent-rgb),.25); border-top-color: var(--accent-text); border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      .result-head { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
      .ring { position: relative; width: 150px; height: 150px; }
      .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .ring strong { position: absolute; inset: 0; display: grid; place-items: center; font-size: 38px; letter-spacing: -.04em; }
      .ring strong small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-top: -26px; }
      .role { margin: 0; font-size: 22px; letter-spacing: -.03em; }
      .tally { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .pill { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
      .reqs { display: grid; gap: 10px; margin: 22px 0 0; padding: 0; list-style: none; }
      .req { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
      .req .icon { grid-row: span 3; font-size: 18px; line-height: 1.4; }
      .req strong { font-size: 15px; }
      .tag { margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--line); font: 600 11px Manrope, sans-serif; color: var(--muted); vertical-align: 2px; }
      .level { font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      .level.strong { color: var(--ok); } .level.partial { color: var(--warn); } .level.none { color: var(--muted); }
      .req p { margin: 0; font-size: 14px; color: var(--muted); }
      .evidence { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      .evidence a { padding: 3px 10px; border: 1px solid rgba(var(--accent-rgb),.35); border-radius: 999px; font-size: 12px; text-decoration: none; color: var(--accent-text); }
      .evidence a:hover { border-color: var(--accent-text); }
      .pitch { margin-top: 26px; padding: 18px; border-left: 3px solid var(--cyan); border-radius: 0 12px 12px 0; background: rgba(var(--accent-2-rgb), .06); }
      .pitch p { margin: 6px 0 12px; }
      .note-ai { font-size: 12px; color: var(--muted); }
      @media (max-width: 640px) { .result-head { grid-template-columns: 1fr; justify-items: start; } .ring { width: 120px; height: 120px; } .ring strong { font-size: 30px; } }
    </style>
    <script src="../demos/demos.js" defer></script>
    <script src="/api.js" defer></script>
    <script src="/i18n.js" defer></script>
    <script src="vaga.js" defer></script>
    <script data-goatcounter="https://emanueleborges.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>
    <div class="shell">
      <header>
        <a class="brand" href="/"><svg class="logo brand-logo" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true" focusable="false"><defs><linearGradient id="lgd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-bg1)"/><stop offset="1" style="stop-color:var(--logo-bg2)"/></linearGradient><linearGradient id="lgd-edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-edge1)"/><stop offset="1" style="stop-color:var(--logo-edge2)"/></linearGradient><linearGradient id="lgd-letter" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-letter1)"/><stop offset="0.55" style="stop-color:var(--logo-letter2)"/><stop offset="1" style="stop-color:var(--logo-letter3)"/></linearGradient><radialGradient id="lgd-node" cx=".35" cy=".35" r=".75"><stop offset="0" style="stop-color:var(--logo-node1)"/><stop offset="0.55" style="stop-color:var(--logo-node2)"/><stop offset="1" style="stop-color:var(--logo-node3)"/></radialGradient><radialGradient id="lgd-shine" cx=".2" cy=".1" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lgd-bg)" stroke="url(#lgd-edge)" stroke-width="2.5"/><rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="url(#lgd-shine)"/><path class="logo-e" d="M17 46.5V17.5h19M17 32h14M17 46.5h19" fill="none" stroke="url(#lgd-letter)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="100"/><circle class="logo-ring" cx="49" cy="46.5" r="7" fill="none" stroke-width="1.6"/><circle class="logo-node" cx="49" cy="46.5" r="4.4" fill="url(#lgd-node)"/></svg> Emanuel Borges</a>
        <div class="header-tools">
          <button class="theme-toggle" type="button" data-theme-toggle><span class="theme-swatch" aria-hidden="true"></span><span class="theme-name" data-theme-name>Amazônia</span></button>
          <label><span class="visually-hidden" data-t="lang">Language</span>
          <select data-lang>
            <option value="en" lang="en">English</option>
            <option value="pt" lang="pt-BR">Português</option>
            <option value="es" lang="es">Español</option>
            <option value="fr" lang="fr">Français</option>
            <option value="it" lang="it">Italiano</option>
            <option value="de" lang="de">Deutsch</option>
            <option value="zh" lang="zh-CN">中文</option>
            <option value="ru" lang="ru">Русский</option>
          </select>
        </label>
        </div>
      </header>

      <main>
        <p class="kicker" data-t="kicker"></p>
        <h1 data-t="title"></h1>
        <p class="lead" data-t="lead"></p>

        <section class="panel">
          <form data-form>
            <label for="job" class="visually-hidden" data-t="jobLabel"></label>
            <textarea id="job" maxlength="8000" data-job data-t-placeholder="jobPh"></textarea>
            <div class="row">
              <button class="button primary" type="submit" data-submit data-t="analyze"></button>
              <button class="button" type="button" data-sample data-t="sample"></button>
              <span class="count" aria-live="polite"><span data-count>0</span> / 8000</span>
            </div>
            <p class="privacy" data-t="privacy"></p>
          </form>
          <div class="loading" data-loading hidden><span class="spinner" aria-hidden="true"></span><span data-loading-text aria-live="polite"></span></div>
          <p class="status" data-status role="status" aria-live="polite"></p>
        </section>

        <section class="panel" data-result hidden aria-live="polite">
          <div class="result-head">
            <div class="ring" data-ring></div>
            <div>
              <p class="kicker" style="margin:0" data-t="resultKicker"></p>
              <h2 class="role" data-role></h2>
              <div class="tally" data-tally></div>
              <p class="note-ai" data-t="scoreNote"></p>
            </div>
          </div>
          <ul class="reqs" data-reqs></ul>
          <div class="pitch">
            <strong data-t="pitchTitle"></strong>
            <p data-pitch></p>
            <button class="button" type="button" data-copy data-t="copy"></button>
          </div>
          <div class="links" style="margin-top:22px">
            <a class="button primary" data-cv download data-t="cv"></a>
            <a class="button" data-contact data-t="contact"></a>
            <button class="button" type="button" data-again data-t="again"></button>
          </div>
          <p class="note-ai" style="margin-top:16px" data-t="aiNote"></p>
        </section>

        <p class="note" style="margin:32px 0 56px"><a href="/" data-t="back"></a></p>
      </main>
    </div>
  </body>
</html>
