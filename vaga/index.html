<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Segurança: só carrega recursos destes domínios (CSP) e não envia o endereço completo a outros sites. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://*.githubusercontent.com https://github.com; connect-src 'self' https://emanuel-portfolio-chat.emanuel-portfolio-chat.workers.dev https://api.github.com https://cdn.jsdelivr.net https://data.jsdelivr.com https://raw.githubusercontent.com; frame-src https://challenges.cloudflare.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title data-t="meta.title" data-perfil="Does your role match {nome}?">Does your role match Emanuel?</title>
    <meta name="description" data-t-content="meta.description" content="Paste a job description and see, requirement by requirement, how Emanuel Borges's profile matches it — with evidence from his portfolio." data-perfil-content="Paste a job description and see, requirement by requirement, how {nomeCompleto}'s profile matches it — with evidence from his portfolio." />
    <meta name="theme-color" content="#050f14" />
    <script src="../idiomas.js"></script>
    <script src="../components/boot.js" data-i18n></script>
    <link rel="icon" href="/imagens/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/imagens/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/imagens/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../temas.css" />
    <link rel="stylesheet" href="../demos/demos.css" />
    <style>
      textarea { width: 100%; min-height: 220px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--text); font: 500 14px/1.6 Manrope, sans-serif; resize: vertical; }
      textarea:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
      .row .count { margin-left: auto; font: 500 12px "DM Mono", monospace; color: var(--muted); }
      .button:disabled { opacity: .5; cursor: progress; }
      .privacy { margin-top: 12px; font-size: 13px; color: var(--muted); }
      .loading[hidden] { display: none; }
      .loading { display: flex; align-items: center; gap: 12px; margin-top: 22px; color: var(--muted); }
      .spinner { width: 22px; height: 22px; border: 3px solid rgba(var(--accent-rgb),.25); border-top-color: var(--accent-text); border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
      .result-head { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }
      /* Velocímetro da nota, radar por pilar e varredura do texto durante a análise */
      .ring { position: relative; width: 200px; }
      .ring svg { display: block; width: 100%; height: auto; }
      .ring strong { display: block; margin-top: -6px; font-size: 34px; letter-spacing: -.04em; text-align: center; line-height: 1; }
      .ring strong small { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
      .gauge-fill { transition: stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1); }
      .gauge-needle { transform-origin: 100px 104px; transform: rotate(var(--angle)); transition: transform 1.2s cubic-bezier(.34,1.3,.5,1); }
      .gauge-needle.is-start { transform: rotate(-90deg); transition: none; }
      .pillars { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 24px; align-items: center; margin: 22px 0 6px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface-2); }
      .pillars > .kicker { grid-column: 1 / -1; }
      .pillars [data-pillars] { display: contents; }
      .radar { width: 100%; max-width: 340px; height: auto; overflow: visible; }
      .radar text { fill: var(--muted); font: 600 9px Manrope, sans-serif; }
      .pillar-bars { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; font-size: 13px; }
      .pillar-bars li { display: grid; grid-template-columns: 1fr 90px 40px; align-items: center; gap: 10px; }
      .pillar-bars small { color: var(--muted); }
      .pillar-bars .bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
      .pillar-bars .bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
      .pillar-bars strong { text-align: right; font-family: "DM Mono", monospace; font-size: 12px; }
      form.is-scanning { position: relative; }
      form.is-scanning textarea { background-image: linear-gradient(180deg, transparent 0, rgba(var(--accent-rgb),.22) 48%, rgba(var(--accent-rgb),.5) 50%, transparent 52%); background-size: 100% 220px; background-repeat: no-repeat; animation: scan 1.6s linear infinite; border-color: rgba(var(--accent-rgb),.6); }
      @keyframes scan { from { background-position: 0 -220px; } to { background-position: 0 calc(100% + 220px); } }
      @media (prefers-reduced-motion: reduce) { form.is-scanning textarea { animation: none; } .gauge-needle, .gauge-fill { transition: none; } }
      @media (max-width: 640px) { .pillars { grid-template-columns: 1fr; } .radar { margin: 0 auto; } }
      .role { margin: 0; font-size: 22px; letter-spacing: -.03em; }
      .tally { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .pill { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
      .reqs { display: grid; gap: 10px; margin: 22px 0 0; padding: 0; list-style: none; }
      .req { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
      .req .icon { grid-row: span 3; font-size: 18px; line-height: 1.4; }
      .req strong { font-size: 15px; }
      .tag { margin-left: 8px; padding: 2px 8px; border-radius: 999px; background: var(--line); font: 600 11px Manrope, sans-serif; color: var(--muted); vertical-align: 2px; }
      .level { font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      .level.strong { color: var(--ok); } .level.partial { color: var(--warn); } .level.none { color: var(--muted); }
      .req p { margin: 0; font-size: 14px; color: var(--muted); }
      .evidence { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
      .evidence a { padding: 3px 10px; border: 1px solid rgba(var(--accent-rgb),.35); border-radius: 999px; font-size: 12px; text-decoration: none; color: var(--accent-text); }
      .evidence a:hover { border-color: var(--accent-text); }
      .pitch { margin-top: 26px; padding: 18px; border-left: 3px solid var(--cyan); border-radius: 0 12px 12px 0; background: rgba(var(--accent-2-rgb), .06); }
      .pitch p { margin: 6px 0 12px; }
      .note-ai { font-size: 12px; color: var(--muted); }
      @media (max-width: 640px) { .result-head { grid-template-columns: 1fr; justify-items: start; } .ring { width: 170px; } .ring strong { font-size: 30px; } }
    </style>
    <script src="/perfil.js" defer></script>
    <script src="/i18n/pt.js" defer></script>
    <script src="/i18n/en.js" defer></script>
    <script src="/i18n.js" defer></script>
    <script type="module" src="vaga.js"></script>
    <script type="module" src="../analytics-consent.js"></script>
    <script src="../components/components.js" defer></script>
  </head>
  <body>
    <div class="glow glow-1" aria-hidden="true"></div>
    <div class="glow glow-2" aria-hidden="true"></div>
    <div class="shell">
      <header>
        <a class="brand" href="/"><site-logo class="brand-logo" size="32"></site-logo><span data-perfil="{nomeCompleto}">Emanuel Borges</span></a>
        <div class="header-tools">
          <share-button></share-button>
          <sound-toggle></sound-toggle>
          <theme-toggle></theme-toggle>
          <label><span class="visually-hidden" data-t="lang">Language</span>
          <select data-lang>
            <option value="en" lang="en">English</option>
            <option value="pt" lang="pt-BR">Português</option>
            <option value="es" lang="es">Español</option>
          </select>
        </label>
        </div>
      </header>

      <main>
        <p class="kicker" data-t="kicker"></p>
        <h1 data-t="title"></h1>
        <p class="lead" data-t="lead"></p>

        <section class="panel">
          <form data-form>
            <label for="job" class="visually-hidden" data-t="jobLabel"></label>
            <textarea id="job" maxlength="8000" data-job data-t-placeholder="jobPh"></textarea>
            <div class="row">
              <button class="button primary" type="submit" data-submit data-t="analyze"></button>
              <button class="button" type="button" data-sample data-t="sample"></button>
              <span class="count" aria-live="polite"><span data-count>0</span> / 8000</span>
            </div>
            <p class="privacy" data-t="privacy"></p>
          </form>
          <div class="loading" data-loading hidden><span class="spinner" aria-hidden="true"></span><span data-loading-text aria-live="polite"></span></div>
          <p class="status" data-status role="status" aria-live="polite"></p>
        </section>

        <section class="panel" data-result hidden aria-live="polite">
          <div class="result-head">
            <div class="ring" data-ring></div>
            <div>
              <p class="kicker" style="margin:0" data-t="resultKicker"></p>
              <h2 class="role" data-role></h2>
              <div class="tally" data-tally></div>
              <p class="note-ai" data-t="scoreNote"></p>
            </div>
          </div>
          <div class="pillars">
            <p class="kicker" style="margin:0 0 6px" data-pillars-title></p>
            <div data-pillars></div>
          </div>
          <ul class="reqs" data-reqs></ul>
          <div class="pitch">
            <strong data-t="pitchTitle"></strong>
            <p data-pitch></p>
            <button class="button" type="button" data-copy data-t="copy"></button>
          </div>
          <div class="links" style="margin-top:22px">
            <a class="button primary" href="/curriculo.html?lang=en&amp;pdf=1" target="_blank" rel="noopener" data-cv data-t="cv"></a>
            <a class="button" href="/#contato" data-contact data-t="contact"></a>
            <button class="button" type="button" data-again data-t="again"></button>
          </div>
          <p class="note-ai" style="margin-top:16px" data-t="aiNote"></p>
        </section>

        <p class="note" style="margin:32px 0 56px"><a href="/" data-t="back"></a></p>
      </main>
    </div>
  </body>
</html>
