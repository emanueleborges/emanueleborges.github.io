    <!-- /gerado: dados -->
    <style>
      @page { size: A4; margin: 13mm 14mm; }
      :root { --ink: #1c1830; --muted: #5d5873; --accent: #6a3df0; --line: #e4def5; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; color: var(--ink); font: 10pt/1.5 "Manrope", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      main { max-width: 182mm; margin: 0 auto; }
      a { color: inherit; text-decoration: none; }
      header { display: flex; gap: 20px; align-items: center; padding-bottom: 14px; border-bottom: 2px solid var(--accent); }
      .photo { flex: 0 0 82px; height: 102px; border-radius: 50%; overflow: hidden; border: 2px solid #d9ccff; }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }
      h1 { margin: 0; font-size: 24pt; line-height: 1.1; letter-spacing: -.03em; }
      .availability { margin: -4px 0 8px; color: #0e7490; font-size: 9pt; font-weight: 700; }
      .role { margin: 4px 0 8px; color: var(--accent); font-size: 11pt; font-weight: 700; }
      .contacts { display: flex; flex-wrap: wrap; gap: 2px 14px; color: var(--muted); font-size: 8.6pt; }
      h2 { margin: 16px 0 7px; color: var(--accent); font-size: 9.5pt; letter-spacing: .12em; text-transform: uppercase; }
      section { break-inside: auto; }
      p { margin: 0; }
      .summary { color: #2e2944; }
      .item { margin-bottom: 9px; break-inside: avoid; }
      .item-head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      .item-head strong { font-size: 10.2pt; }
      .period { flex: none; color: var(--muted); font-size: 8.4pt; font-weight: 600; white-space: nowrap; }
      .company { color: var(--accent); font-size: 9pt; font-weight: 600; }
      ul { margin: 3px 0 0; padding-left: 15px; }
      li { margin: 1px 0; }
      .stack { color: var(--muted); font-size: 7.8pt; letter-spacing: .06em; text-transform: uppercase; }
      .projects { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
      .projects .item p { font-size: 9pt; color: #2e2944; }
      .skills { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 9.2pt; }
      .skills dt { font-weight: 700; }
      .skills dd { margin: 0; color: #2e2944; }
      .edu li { display: flex; gap: 12px; align-items: center; list-style: none; margin: 0 0 7px -15px; }
      .edu-logo { flex: 0 0 64px; display: grid; place-items: center; height: 30px; }
      .edu-logo img { max-width: 64px; max-height: 22px; object-fit: contain; filter: brightness(0); opacity: .7; }
      .edu-logo img.logo-keep { filter: none; opacity: .85; }
      .edu span { color: var(--muted); }
      .muted { color: #2e2944; font-size: 9.2pt; }
      @media screen { body { padding: 32px 16px; background: #f1eef9; } main { background: #fff; padding: 14mm; box-shadow: 0 10px 40px rgba(28,24,48,.12); } }
      /* Celular: uma coluna, sem a "folha" A4 (o PDF, gerado na impressão, não muda). */
      @media screen and (max-width: 640px) {
        body { padding: 0; background: #fff; }
        main { padding: 22px 18px 32px; box-shadow: none; }
        header { flex-direction: column; align-items: flex-start; gap: 12px; }
        h1 { font-size: 22pt; }
        .item-head { flex-wrap: wrap; gap: 0 12px; }
        .projects, .skills { grid-template-columns: 1fr; }
        .skills dt { margin-top: 6px; }
      }
      /* "Baixar PDF": a impressão do navegador gera o PDF ("Salvar como PDF") a partir desta mesma página. */
      .cv-actions { max-width: 182mm; margin: 0 auto 12px; text-align: right; }
      .cv-actions button { padding: 9px 16px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: 700 9.5pt "Manrope", sans-serif; cursor: pointer; }
      .cv-actions button:focus-visible { outline: 3px solid #d9ccff; outline-offset: 2px; }
      @media print { .cv-actions { display: none; } }
      @media screen and (max-width: 640px) { .cv-actions { margin: 0; padding: 12px 18px 0; } }
      /* Dentro do modal do portfólio (?embed=1): o botão fica na barra do modal. */
      .is-embedded .cv-actions { display: none; }
      .is-embedded body { padding: 20px 12px; }
      @media screen and (max-width: 640px) { .is-embedded body { padding: 0; } }
    </style>
  </head>
  <body>
    <p class="cv-actions"><button type="button" data-print></button></p>
    <main id="cv"></main>
    <script>
      const P = window.PERFIL; // dados pessoais (perfil.js)
      const semProtocolo = (url) => url.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
      const all = window.I18N;
      const params = new URLSearchParams(location.search);
      const lang = Object.hasOwn(all, params.get("lang") ?? "") ? params.get("lang") : "en";
      const dict = all[lang];
      const tr = (key) => dict[key] ?? all.pt[key] ?? "";
      const plain = (key) => tr(key).replace(/<br\s*\/?>/g, " ").replace(/<span>[↗↘↓]<\/span>/g, "").trim();
      const htmlLang = Object.fromEntries(Object.entries(globalThis.IDIOMAS).map(([code, idioma]) => [code, idioma.html])); // idiomas.js

      document.documentElement.lang = htmlLang[lang];
      // O título vira o nome sugerido do arquivo ao salvar como PDF.
      document.title = plain("cv.pageTitle");

      // "Baixar PDF": o PDF gerado pelo Worker (PERFIL.cvPdf, Browser Run). Na versão de impressão
      // (?pdf=1 — a reserva do Worker, ou sem Worker), o botão e o carregamento abrem a impressão
      // do navegador, já com o layout A4 (@page) → "Salvar como PDF".
      const printButton = document.querySelector("[data-print]");
      printButton.textContent = plain("demo.download");
      const workerPdf = !params.has("pdf") && P.servicos?.worker;
      printButton.addEventListener("click", () => (workerPdf ? (location.href = P.cvPdf(lang)) : print()));
      if (params.has("pdf")) addEventListener("load", () => document.fonts.ready.then(() => print()));

      // Experiência, projetos, habilidades e formação: data/ (bloco gerado acima, window.CURRICULO).
      const { jobs, projects, skills, education } = window.CURRICULO;
      const textOf = (value) => (value.key ? tr(value.key) : value.text);

      const escapeText = (text) => text.replace(/&(?!amp;|lt;|gt;)/g, "&amp;");

      document.querySelector("#cv").innerHTML = `
        <header>
          <div class="photo"><img src="${P.foto}" alt="${tr("about.photoAlt")}" /></div>
          <div>
            <h1>${P.nomeCompleto}</h1>
            <p class="role">${tr("cv.role")}</p>
            <p class="availability">${tr("cv.availability")}</p>
            <div class="contacts">
              <a href="${P.links.email}">${P.email}</a>
              <a href="${P.links.whatsapp}">${P.telefone}</a>
              <span>${tr("cv.location")}</span>
              <a href="${P.links.linkedin}">${semProtocolo(P.links.linkedin)}</a>
              <a href="${P.links.github}">${semProtocolo(P.links.github)}</a>
              <a href="${P.site}?ref=curriculo-${lang}">${tr("cv.portfolio")}: ${semProtocolo(P.site)}</a>
            </div>
          </div>
        </header>

        <section>
          <h2>${tr("cv.summary")}</h2>
          <p class="summary">${tr("about.lead")} ${tr("about.body")}</p>
        </section>

        <section>
          <h2>${tr("cv.experience")}</h2>
          ${jobs.map((job) => `
            <div class="item">
              <div class="item-head"><strong>${tr(job.title)}</strong><span class="period">${tr(job.period)}</span></div>
              <div class="company">${textOf(job.company)}</div>
              <ul>${job.bullets.map((b) => `<li>${tr(b)}</li>`).join("")}</ul>
            </div>`).join("")}
        </section>

        <section>
          <h2>${tr("cv.projects")}</h2>
          <div class="projects">
            ${projects.map((p) => `
              <div class="item">
                <strong>${p.name ?? tr(p.title)}</strong>
                <div class="stack">${p.stack}</div>
                <p>${tr(p.desc)}</p>
              </div>`).join("")}
          </div>
        </section>

        <section>
          <h2>${tr("cv.skills")}</h2>
          <dl class="skills">
            ${skills.map((group) => `<dt>${tr(group.title)}</dt><dd>${escapeText(group.items.map(textOf).join(", "))}</dd>`).join("")}
          </dl>
        </section>

        <section>
          <h2>${tr("cv.education")}</h2>
          <ul class="edu">
            ${education.map((c) => `<li><span class="edu-logo"><img src="${c.logo}" alt=""${c.manterCores ? ' class="logo-keep"' : ""} /></span><span><strong>${tr(c.key)}</strong><br /><span>${c.school} · ${c.period}${c.emAndamento ? ` ${tr("edu.inProgress")}` : ""}</span></span></li>`).join("")}
          </ul>
        </section>

        <section>
          <h2>${tr("cv.certifications")}</h2>
          <p class="muted">${tr("edu.certList")}</p>
        </section>

        <section>
          <h2>${tr("cv.languages")}</h2>
          <p class="muted">${tr("edu.langList")}</p>
        </section>
      `;
    </script>
  </body>
</html>
